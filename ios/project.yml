name: NFSU2iOS
options:
  bundleIdPrefix: dev.lyszq
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: 'NO'
    CODE_SIGNING_ALLOWED: 'NO'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
targets:
  NFSU2iOS:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - path: NFSU2iOS
      - path: ../runtime/guest_memory.c
      - path: ../runtime/guest_pe.c
      - path: ../runtime/guest_dispatch.c
      - path: ../runtime/guest_execution.c
      - path: ../runtime/guest_bootstrap.c
      - path: ../runtime/guest_windows.c
      - path: ../runtime/guest_resources.c
      - path: ../runtime/guest_user_objects.c
      - path: ../runtime/guest_toolhelp.c
      - path: ../runtime/guest_clock.c
      - path: ../runtime/guest_registry.c
      - path: ../runtime/guest_cursor.c
      - path: ../runtime/guest_cpuid.c
      - path: ../runtime/guest_heap.c
      - path: ../runtime/guest_critical.c
      - path: ../runtime/guest_tls.c
      - path: ../runtime/guest_process.c
      - path: ../runtime/guest_startup.c
      - path: ../runtime/guest_error.c
      - path: ../runtime/guest_stdio.c
      - path: ../runtime/guest_locale.c
      - path: tests/cpu_flags_test.c
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lyszq.nfsu2ios
        PRODUCT_NAME: NFSU2iOS
        CODE_SIGN_ENTITLEMENTS: NFSU2iOS/NFSU2iOS.entitlements
        GCC_OPTIMIZATION_LEVEL: '2'
        GCC_STRICT_ALIASING: 'NO'
        GCC_C_LANGUAGE_STANDARD: gnu11
        LD_GENERATE_MAP_FILE: 'YES'
        SWIFT_OBJC_BRIDGING_HEADER: NFSU2iOS/Native/NFSU2BridgingHeader.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../runtime
          - $(SRCROOT)/NFSU2iOS/Native
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: 'YES'
        INFOPLIST_KEY_UIRequiresFullScreen: 'YES'
        INFOPLIST_KEY_UIInterfaceOrientation: 'UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    info:
      path: NFSU2iOS/Info.plist
      properties:
        CFBundleDisplayName: NFSU2 iOS
        CFBundleShortVersionString: '0.19.0'
        CFBundleVersion: '26'
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
