name: iOS runtime smoke test (unsigned IPA)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'runtime/cpu.h'
      - 'runtime/guest_memory.*'
      - 'runtime/guest_pe.*'
      - 'runtime/guest_dispatch.*'
      - 'runtime/guest_execution.*'
      - 'runtime/guest_bootstrap.*'
      - 'runtime/guest_windows.*'
      - 'runtime/guest_registry.*'
      - 'runtime/guest_cpuid.*'
      - 'runtime/guest_cursor.*'
      - 'runtime/guest_resources.*'
      - 'runtime/guest_user_objects.*'
      - 'runtime/guest_toolhelp.*'
      - 'runtime/guest_clock.*'
      - 'runtime/guest_heap.*'
      - 'runtime/guest_critical.*'
      - 'runtime/guest_tls.*'
      - 'runtime/guest_process.*'
      - 'runtime/guest_startup.*'
      - 'runtime/guest_error.*'
      - 'runtime/guest_stdio.*'
      - 'runtime/guest_locale.*'
      - 'runtime/guest_file.*'
      - 'runtime/metal.*'
      - 'runtime/metal_framebuffer_pool.h'
      - 'runtime/metal_pipeline_cache.h'
      - 'runtime/gfx.h'
      - 'runtime/audio.*'
      - 'runtime/com.c'
      - 'runtime/overrides.c'
      - 'runtime/game_rumble.h'
      - 'runtime/d3d9_tables.h'
      - 'runtime/fileio.*'
      - 'runtime/dispatch.c'
      - 'runtime/mem.c'
      - 'runtime/win32*'
      - 'runtime/bc_decoder.h'
      - 'tests/win32_*'
      - 'tests/bc_decoder*'
      - 'tests/metal_framebuffer_pool_test.c'
      - 'tests/metal_pipeline_cache_test.c'
      - 'tests/audio_*'
      - 'tests/fileio_*'
      - 'tests/guest_memory*'
      - 'tests/guest_pe*'
      - 'tests/guest_dispatch*'
      - 'tests/guest_execution*'
      - 'tests/guest_windows*'
      - 'tests/guest_registry*'
      - 'tests/guest_cpuid*'
      - 'tests/guest_cursor*'
      - 'tests/guest_resources*'
      - 'tests/guest_user_objects*'
      - 'tests/test_guest_toolhelp*'
      - 'tests/guest_clock*'
      - 'tests/guest_metrics*'
      - 'tests/guest_processor*'
      - 'tests/guest_window_query*'
      - 'tests/guest_locale*'
      - 'tests/guest_file*'
      - 'tests/guest_wchar*'
      - 'tests/guest_heap*'
      - 'tests/guest_critical*'
      - 'tests/guest_tls*'
      - 'tests/guest_startup*'
      - 'tests/guest_error*'
      - 'tests/guest_stdio*'
      - 'tests/guest_process*'
      - 'tests/guest_time*'
      - 'tests/input_bridge*'
      - 'tests/input_lifecycle*'
      - 'tests/game_rumble*'
      - 'tests/ios_file_storage*'
      - 'tests/run_guest_tests.sh'
      - 'tests/ios_startup_probe*'
      - 'tests/fixtures/windows_nls_cp1252.json'
      - 'tools/ios_private/startup_probe.c.in'
      - 'tools/ios_private/*.py'
      - 'tools/ios_private/requirements.txt'
      - '.github/workflows/ios-bootstrap.yml'

permissions:
  contents: read

jobs:
  test-linux:
    name: Shared guest memory and CPU tests (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Authored generation and private-verifier contract tests (no game input)
        run: |
          python3 -m venv "$RUNNER_TEMP/contract-python"
          "$RUNNER_TEMP/contract-python/bin/pip" install -r tools/ios_private/requirements.txt
          "$RUNNER_TEMP/contract-python/bin/python" -m unittest discover -s tools/ios_private -p 'test_*.py'
      - run: bash tests/run_guest_tests.sh "$RUNNER_TEMP/guest-tests"

  build-ios:
    name: Shared runtime tests + native ARM64 IPA
    # Match the available private build host; the iOS target remains ARM64.
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Toolchain diagnostics
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Run shared runtime and desktop adapter tests (macOS)
        run: |
          set -euo pipefail
          bash tests/run_guest_tests.sh "$RUNNER_TEMP/guest-tests" | tee "$RUNNER_TEMP/guest-tests.txt"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Compile for physical iPhone and iPad (no signing)
        working-directory: ios
        run: |
          xcodebuild \
            -project NFSU2iOS.xcodeproj \
            -scheme NFSU2iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NFSU2DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify ARM64 and shared runtime linkage
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NFSU2DerivedData/Build/Products/Release-iphoneos/NFSU2iOS.app"
          test "$(lipo -archs "$APP/NFSU2iOS")" = arm64
          MAP="$RUNNER_TEMP/NFSU2DerivedData/Build/Intermediates.noindex/NFSU2iOS.build/Release-iphoneos/NFSU2iOS.build/NFSU2iOS-LinkMap-normal-arm64.txt"
          test -f "$MAP"
          sed '/^# Dead Stripped Symbols/,$d' "$MAP" > "$RUNNER_TEMP/live-symbols.txt"
          for SYMBOL in guest_memory_init guest_memory_commit guest_memory_protect guest_memory_shutdown guest_memory_pointer nfs_cpu_flags_test guest_pe_load nfs_guest_image_probe guest_dispatch_lookup; do
            grep -E "[[:space:]]_$SYMBOL$" "$RUNNER_TEMP/live-symbols.txt" | tee -a "$RUNNER_TEMP/guest-tests.txt"
          done
          echo 'PASS | physical-device ARM64 binary links shared memory and CPU tests' | tee -a "$RUNNER_TEMP/guest-tests.txt"

      - name: Package unsigned runtime IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NFSU2DerivedData/Build/Products/Release-iphoneos/NFSU2iOS.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/nfsu2-ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/nfsu2-ipa/Payload/NFSU2iOS.app"
          (cd "$RUNNER_TEMP/nfsu2-ipa" && zip -qry "$GITHUB_WORKSPACE/NFSU2iOS-runtime-smoke-unsigned.ipa" Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NFSU2iOS-runtime-smoke-unsigned
          path: NFSU2iOS-runtime-smoke-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload runtime test and link evidence
        uses: actions/upload-artifact@v4
        with:
          name: NFSU2iOS-shared-runtime-evidence
          path: ${{ runner.temp }}/guest-tests.txt
          if-no-files-found: error
          retention-days: 14

  test-import-ui:
    name: iPad Simulator document picker and Files handoff (no game input)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen for the diagnostic UI harness
        run: brew install xcodegen
      - name: Build document-picker regression on an SDK-matched iPad Simulator
        run: |
          set -euo pipefail
          python3 tools/ios_private/import_ui_smoke.py select --out "$RUNNER_TEMP/import-device.json"
          python3 tools/ios_private/import_ui_smoke.py build \
            --device-json "$RUNNER_TEMP/import-device.json" \
            --derived "$RUNNER_TEMP/ImportUIDerivedData" --out "$RUNNER_TEMP/import-ui-evidence"

      - name: Test Files picker cancel and reopen plus first-launch Documents
        run: |
          set -euo pipefail
          python3 tools/ios_private/import_ui_smoke.py run \
            --device-json "$RUNNER_TEMP/import-device.json" \
            --derived "$RUNNER_TEMP/ImportUIDerivedData" --out "$RUNNER_TEMP/import-ui-evidence"

      - name: Upload document-picker UI evidence (no game input)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFSU2iOS-import-ui-evidence
          path: |
            ${{ runner.temp }}/import-device.json
            ${{ runner.temp }}/import-ui-evidence/
          if-no-files-found: warn
          retention-days: 7
